name: Pulse

# Short scheduled checks (12 Nov 2026): the community jobs moved to the live bot on Cloudflare, because GitHub's terms rule
# out Actions as an always-on service. This keeps only checking and backup work: the watchdog (is the live bot up, did the
# backups and deploys run), the seasonal server icon and event covers, and the open-source backup picture and text checks.
# It never writes to this repository: its memory lives in a hidden Discord channel.
# GitHub can delay or drop busy schedules; that's fine now (the Worker only worries after 3 quiet hours).
on:
  schedule:
    - cron: '3-59/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulse
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # read how the other jobs went (watchdog)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unlock the encrypted files
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          # Ubuntu's mirror can be down (11 Nov 2026), so: try it a few times, then build git-crypt 0.8.0 from its source.
          (timeout 60 sudo apt-get update -qq -o Acquire::Retries=1 && timeout 60 sudo apt-get install -y -qq -o Acquire::Retries=1 git-crypt > /dev/null) \
            || (git clone -q --depth 1 --branch 0.8.0 https://github.com/AGWA/git-crypt "$RUNNER_TEMP/gc" && make -s -C "$RUNNER_TEMP/gc" && sudo make -s -C "$RUNNER_TEMP/gc" install PREFIX=/usr/local)
          echo "$GIT_CRYPT_KEY" | base64 -d > "$RUNNER_TEMP/repo.key"
          git-crypt unlock "$RUNNER_TEMP/repo.key"
          rm -f "$RUNNER_TEMP/repo.key"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the open-source checkers (NSFWJS and Detoxify), once per run
        run: timeout 10m npm i --no-save --no-audit --no-fund nsfwjs@4 @tensorflow/tfjs-node@4 @huggingface/transformers@3 || echo "::warning::open-source checkers didn't install; the live bot's own checks carry on"
      - name: One round of checks
        run: |
          timeout 8m node bot/run.mjs pulse || echo "::warning::pulse run failed, trying again next time"
          timeout 4m node bot/run.mjs eyes || echo "::warning::backup picture check failed"
          timeout 4m node bot/run.mjs ears || echo "::warning::backup text check failed"
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
