name: Pulse

# Every 10 minutes the assistant looks round the server: welcomes, starboard, counting, trivia,
# birthdays, special dates, Easter eggs, the weekly digest and friends' uploads, plus the watchdog's checks.
# It never writes to this repository: its memory lives in a hidden Discord channel.
# GitHub often skips frequent schedules (11 Nov 2026: twice since midnight), so one run now works every 10 minutes
# for about 5.5 hours, then starts the next run itself (allowed for workflow_dispatch). The hourly schedule is only a
# backup starter, and the Worker's watchdog alarms if the pulse ever goes quiet.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulse
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    permissions:
      contents: read
      actions: write # read how the other jobs went (watchdog), and start the next pulse run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unlock the encrypted files
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          # Ubuntu's mirror can be down (11 Nov 2026), so: try it a few times, then build git-crypt 0.8.0 from its source.
          (sudo apt-get update -qq -o Acquire::Retries=3 && sudo apt-get install -y -qq -o Acquire::Retries=3 git-crypt > /dev/null) \
            || (git clone -q --depth 1 --branch 0.8.0 https://github.com/AGWA/git-crypt "$RUNNER_TEMP/gc" && make -s -C "$RUNNER_TEMP/gc" && sudo make -s -C "$RUNNER_TEMP/gc" install PREFIX=/usr/local)
          echo "$GIT_CRYPT_KEY" | base64 -d > "$RUNNER_TEMP/repo.key"
          git-crypt unlock "$RUNNER_TEMP/repo.key"
          rm -f "$RUNNER_TEMP/repo.key"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Pulse every 10 minutes for about 5.5 hours
        run: |
          end=$(( $(date +%s) + 330 * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            start=$(date +%s)
            git pull -q --ff-only origin main 2>/dev/null || true
            timeout 8m node bot/run.mjs pulse || echo "::warning::pulse run failed, trying again in 10 minutes"
            sleep $(( 600 - ($(date +%s) - start) > 0 ? 600 - ($(date +%s) - start) : 1 ))
          done
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Start the next pulse run
        if: always()
        run: gh workflow run pulse.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
