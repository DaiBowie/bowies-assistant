name: Live Worker

# Deploys the live part of the bot (slash commands, buttons, AI chat) to Cloudflare's free plan,
# then registers the commands with Discord. Runs when the Worker or its trivia changes, or by hand.
on:
  push:
    branches: [main]
    paths: ['worker/**', 'os/**', 'brand/alerts/**', 'content/expiries.json', 'content/trivia.json', 'content/gifs.json', 'content/ban-lines.json', 'content/escalation.json']
  workflow_dispatch:
  # Every Monday at 4am: a fresh deploy so the open-source scam, slur and lookalike lists stay up to date.
  schedule:
    - cron: '7 4 * * 1'

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only to publish the release notes for each tested version
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unlock the encrypted files
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          # Ubuntu's mirror can be down (11 Nov 2026), so: try it a few times, then build git-crypt 0.8.0 from its source.
          (timeout 60 sudo apt-get update -qq -o Acquire::Retries=1 && timeout 60 sudo apt-get install -y -qq -o Acquire::Retries=1 git-crypt > /dev/null) \
            || (git clone -q --depth 1 --branch 0.8.0 https://github.com/AGWA/git-crypt "$RUNNER_TEMP/gc" && test "$(git -C "$RUNNER_TEMP/gc" rev-parse HEAD)" = 160cf642e1c0f83c1668ad0d59e879d97b97a95b && make -s -C "$RUNNER_TEMP/gc" && sudo make -s -C "$RUNNER_TEMP/gc" install PREFIX=/usr/local)
          echo "$GIT_CRYPT_KEY" | base64 -d > "$RUNNER_TEMP/repo.key"
          git-crypt unlock "$RUNNER_TEMP/repo.key"
          rm -f "$RUNNER_TEMP/repo.key"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Tests first
        run: node --test tests/*.test.mjs
      # The deploy guard: note the live version and save a database restore point first.
      - name: Deploy guard (before)
        run: node worker/verify.mjs before
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to Cloudflare and connect Discord
        run: node worker/deploy.mjs
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PULSE_TRIGGER_TOKEN: ${{ secrets.PULSE_TRIGGER_TOKEN }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
      # Then test the new version for real, and roll back by itself if something important broke.
      - name: Deploy guard (test the new version, roll back if needed)
        run: node worker/verify.mjs after
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'Weekly refresh of the open-source lists' }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # A numbered release on GitHub for every version that passed its tests (what changed, from the commit).
      - name: Release notes
        if: github.event_name == 'push'
        run: |
          tag="v$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" --notes "${COMMIT_MESSAGE}

          Tested by the deploy guard before going live." || true
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
