name: Check

# Runs on every change. Never uses the Discord token. Every tool is pinned and checksum-verified.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code:
    name: Code (tests, types, lint)
    # The code is encrypted, so this job needs the key, which outside pull requests never get.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unlock the encrypted files
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          # Ubuntu's mirror can be down (11 Nov 2026), so: try it a few times, then build git-crypt 0.8.0 from its source.
          (timeout 60 sudo apt-get update -qq -o Acquire::Retries=1 && timeout 60 sudo apt-get install -y -qq -o Acquire::Retries=1 git-crypt > /dev/null) \
            || (git clone -q --depth 1 --branch 0.8.0 https://github.com/AGWA/git-crypt "$RUNNER_TEMP/gc" && make -s -C "$RUNNER_TEMP/gc" && sudo make -s -C "$RUNNER_TEMP/gc" install PREFIX=/usr/local)
          echo "$GIT_CRYPT_KEY" | base64 -d > "$RUNNER_TEMP/repo.key"
          git-crypt unlock "$RUNNER_TEMP/repo.key"
          rm -f "$RUNNER_TEMP/repo.key"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install checking tools
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Package security (known holes in the packages the bot runs)
        # Dependabot can't read the encrypted package list, so the check runs here, after unlocking (14 Nov 2026).
        # A critical hole stops the run; a high one is a warning so it's fixed without blocking an urgent safety fix.
        run: |
          npm audit --omit=dev || true
          if ! npm audit --omit=dev --audit-level=critical > /dev/null; then echo "::error::A package the bot runs has a critical security hole (see the list above)"; exit 1; fi
          if ! npm audit --omit=dev --audit-level=high > /dev/null; then echo "::warning::A package the bot runs has a high-severity security advisory (see the list above)"; fi
      - name: Syntax
        run: for f in bot/*.mjs; do node --check "$f"; done
      - name: Tests (with coverage)
        run: npm test
      - name: Types (TypeScript checks the JavaScript)
        run: npm run typecheck
      - name: Lint (Biome)
        run: npm run lint

  workflows:
    name: Workflow security (actionlint, zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download pinned, checksum-verified tools
        run: |
          curl -sSfL -o al.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  al.tgz" | sha256sum -c -
          tar xzf al.tgz actionlint
          curl -sSfL -o zz.tgz https://github.com/zizmorcore/zizmor/releases/download/v1.32.0/zizmor-x86_64-unknown-linux-gnu.tar.gz
          echo "bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b  zz.tgz" | sha256sum -c -
          tar xzf zz.tgz zizmor
      - name: actionlint
        run: ./actionlint
      - name: zizmor
        run: ./zizmor --offline --min-severity low .github/workflows

  secrets:
    name: Secret scan (Gitleaks, full history)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Unlock the encrypted files
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          # Ubuntu's mirror can be down (11 Nov 2026), so: try it a few times, then build git-crypt 0.8.0 from its source.
          (timeout 60 sudo apt-get update -qq -o Acquire::Retries=1 && timeout 60 sudo apt-get install -y -qq -o Acquire::Retries=1 git-crypt > /dev/null) \
            || (git clone -q --depth 1 --branch 0.8.0 https://github.com/AGWA/git-crypt "$RUNNER_TEMP/gc" && make -s -C "$RUNNER_TEMP/gc" && sudo make -s -C "$RUNNER_TEMP/gc" install PREFIX=/usr/local)
          echo "$GIT_CRYPT_KEY" | base64 -d > "$RUNNER_TEMP/repo.key"
          git-crypt unlock "$RUNNER_TEMP/repo.key"
          rm -f "$RUNNER_TEMP/repo.key"
      - name: Download pinned, checksum-verified Gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gl.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gl.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/gl.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Gitleaks (history)
        run: '"$RUNNER_TEMP/gitleaks" git . --no-banner --redact --exit-code 1'
      - name: Gitleaks (the unlocked files)
        run: '"$RUNNER_TEMP/gitleaks" dir . --no-banner --redact --exit-code 1'
      - name: Discord-token pattern check
        run: |
          if grep -rEn '[MN][A-Za-z0-9_-]{23,25}\.[A-Za-z0-9_-]{6}\.[A-Za-z0-9_-]{27,40}' --exclude-dir=.git . ; then
            echo "::error::Something that looks like a Discord token is in the repository"; exit 1
          fi
