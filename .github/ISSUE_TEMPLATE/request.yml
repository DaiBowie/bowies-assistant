name: Request for Bowie's Assistant
description: Ask for something in the server (Claude picks it up in your next chat)
title: '[Request] '
body:
  - type: dropdown
    id: who
    attributes:
      label: Who's asking?
      options: [Dai, Wolf]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What would you like?
      description: Plain words are perfect. Screenshots welcome.
    validations:
      required: true
  - type: checkboxes
    id: delete
    attributes:
      label: Deleting anything?
      options:
        - label: Yes, this includes deleting something and I'm saying yes to it
